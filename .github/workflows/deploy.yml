name: Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl build-essential pkg-config libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdbook preprocessors (cargo install)
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: |
          export PATH="${CARGO_HOME}/bin:$PATH"
          # Pin versions if you want reproducible builds
          cargo install --locked mdbook-katex|| true
          cargo install --locked mdbook-image-size|| true
          cargo install --locked mdbook-numthm|| true
          cargo install --locked mdbook-bib || true
          echo "${CARGO_HOME}/bin" >> $GITHUB_PATH

      - name: Install latest mdbook (official release)
        run: |
          tag=$(curl -s 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -r '.tag_name')
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook
          curl -sSL $url | tar -xz --directory=./mdbook
          echo `pwd`/mdbook >> $GITHUB_PATH

      - name: Verify tools
        run: |
          mdbook --version
          mdbook-katex --version || echo "mdbook-katex not found"
          mdbook-image-size --version || echo "mdbook-image-size not found"
          mdbook-numthm --version || echo "mdbook-numthm not found"
          mdbook-bib --version || echo "mdbook-bib not found"

      - name: Build Book
        run: |
          # This assumes your book is in the root of your repository.
          # Just add a `cd` here if you need to change to another directory.
          mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'book'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4