name: Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook preprocessors (cargo install)
        run: |
          # Install mdbook-bib from pre-built binary
          cargo install mdbook-bib --version 0.0.5

          cargo install mdbook mdbook-katex mdbook-toc mdbook-footnote mdbook-numeq mdbook-numthm mdbook-image-size 

      - name: Build Book
        run: |
          # This assumes your book is in the root of your repository.
          # Just add a `cd` here if you need to change to another directory.
          mdbook build 

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'book'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4